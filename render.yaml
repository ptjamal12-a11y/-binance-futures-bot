services:
  - type: web
    name: binance-futures-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: AUTO_SCAN
        value: "true"
      - key: INTERVAL
        value: "5m"
      - key: SCAN_EVERY_SECONDS
        value: "300"
      - key: MAX_SYMBOLS
        value: "80"
      - key: MIN_QUOTE_VOLUME
        value: "25000000"
      - key: MIN_SCORE_TO_NOTIFY
        value: "75"
